s-serif" font-size="44" font-weight="900" letter-spacing="-.5" transform="translate(100, 140)">Awesome Command Shells</text></g><g transform="translate(102, 195)"><text fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20" font-weight="700">❯</text><text x="24" y="0" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" font-weight="500">curl -sSL https://awesome.shells | run --structured --interactive</text><rect width="10" height="20" x="668" y="-16" fill="#38bdf8" class="cursor-blink" rx="2"/></g><g><text fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" transform="translate(102, 235)">Curated ecosystem of next-gen CLI interpreters, structured data pipelines, object shells &amp; cloud workspaces</text></g><g transform="translate(102, 275)"><rect width="130" height="28" x="0" y="0" fill="#0369a1" fill-opacity=".35" stroke="#38bdf8" stroke-width="1" rx="14"/><text x="65" y="18" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ POSIX &amp; Bash</text><rect width="150" height="28" x="145" y="0" fill="#4338ca" fill-opacity=".35" stroke="#818cf8" stroke-width="1" rx="14"/><text x="220" y="18" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">📊 Structured Data</text><rect width="140" height="28" x="310" y="0" fill="#6d28d9" fill-opacity=".35" stroke="#c084fc" stroke-width="1" rx="14"/><text x="380" y="18" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">🧩 Object Pipelines</text><rect width="140" height="28" x="465" y="0" fill="#0f766e" fill-opacity=".35" stroke="#2dd4bf" stroke-width="1" rx="14"/>