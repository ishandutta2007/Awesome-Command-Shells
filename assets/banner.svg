<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient><linearGradient id="textGradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="borderGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".6"/><stop offset="50%" stop-color="#818cf8" stop-opacity=".2"/><stop offset="100%" stop-color="#38bdf8" stop-opacity=".5"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".8"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.65;transform:scale(1.05)}}@keyframes floatParticle{0%{transform:translateY(0) translateX(0);opacity:.2}50%{transform:translateY(-25px) translateX(15px);opacity:.7}}@keyframes blinkCursor{0%,49%{opacity:1}50%{opacity:0}}@keyframes scanline{0%{transform:translateY(0)}}.particle-1{animation:floatParticle 8s ease-in-out infinite}.particle-2{animation:floatParticle 11s ease-in-out infinite reverse}.particle-3{animation:floatParticle 7s ease-in-out infinite 2s}.cursor-blink{animation:blinkCursor 1s infinite}.glow-orb{animation:pulseGlow 6s ease-in-out infinite alternate;transform-origin:center}</style></defs><rect width="1200" height="360" fill="url(#bgGradient)" stroke="url(#borderGradient)" stroke-width="2" rx="16"/><g class="glow-orb" opacity=".4"><circle cx="1