<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Header Gradient for Text -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.05); }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
        50% { transform: translateY(-25px) translateX(15px); opacity: 0.7; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      }
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes scanline {
        0% { transform: translateY(0); }
        100% { transform: translateY(360px); }
      }
      .particle-1 { animation: floatParticle 8s ease-in-out infinite; }
      .particle-2 { animation: floatParticle 11s ease-in-out infinite reverse; }
      .particle-3 { animation: floatParticle 7s ease-in-out infinite 2s; }
      .cursor-blink { animation: blinkCursor 1s infinite; }
      .glow-orb { animation: pulseGlow 6s ease-in-out infinite alternate; transform-origin: center; }
      .scan-line { animation: scanline 8s linear infinite; }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" stroke="url(#borderGradient)" stroke-width="2" />

  <!-- Dynamic / Animated Background Orbs (Behind foreground content) -->
  <g class="glow-orb" opacity="0.4">
    <circle cx="150" cy="90" r="140" fill="#0284c7" filter="url(#glow)" opacity="0.3" />
    <circle cx="1050" cy="270" r="160" fill="#6366f1" filter="url(#glow)" opacity="0.25" />
    <circle cx="850" cy="80" r="120" fill="#a855f7" filter="url(#glow)" opacity="0.2" />
  </g>

  <!-- Animated Floating Particles (Depth layer) -->
  <g>
    <circle class="particle-1" cx="220" cy="260" r="3.5" fill="#38bdf8" />
    <circle class="particle-2" cx="380" cy="80" r="2.5" fill="#818cf8" />
    <circle class="particle-3" cx="720" cy="280" r="4" fill="#a855f7" />
    <circle class="particle-1" cx="940" cy="140" r="3" fill="#38bdf8" />
    <circle class="particle-2" cx="1100" cy="70" r="3.5" fill="#818cf8" />
    <circle class="particle-3" cx="120" cy="290" r="2.5" fill="#38bdf8" />
  </g>

  <!-- Decorative Modern Grid Background Overlay -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="500" y1="0" x2="500" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
    <line x1="1100" y1="0" x2="1100" y2="360" />
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Foreground Terminal Window Header Bar -->
  <rect x="70" y="35" width="1060" height="290" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
  
  <!-- Window Controls / Dots -->
  <g transform="translate(95, 55)">
    <circle cx="0" cy="0" r="6.5" fill="#ef4444" />
    <circle cx="22" cy="0" r="6.5" fill="#f59e0b" />
    <circle cx="44" cy="0" r="6.5" fill="#10b981" />
  </g>

  <!-- Interactive Terminal Prompt Line & Shell Badge -->
  <g transform="translate(180, 56)">
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600" fill="#64748b">
      bash ~ zsh ~ fish ~ nushell ~ pwsh
    </text>
  </g>

  <!-- Main Title (Crisp Foreground, guaranteed visibility) -->
  <g transform="translate(100, 140)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="44" fill="url(#textGradient)" letter-spacing="-0.5">
      Awesome Command Shells
    </text>
  </g>

  <!-- Animated Interactive Command Prompt Line -->
  <g transform="translate(102, 195)">
    <!-- Terminal Prompt Symbol -->
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="700" font-size="20" fill="#38bdf8">❯</text>
    
    <!-- Command Text -->
    <text x="24" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" font-weight="500" fill="#f8fafc">
      curl -sSL https://awesome.shells | run --structured --interactive
    </text>
    
    <!-- Blinking Cursor -->
    <rect class="cursor-blink" x="668" y="-16" width="10" height="20" rx="2" fill="#38bdf8" />
  </g>

  <!-- Subtitle / Tagline Description -->
  <g transform="translate(102, 235)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Curated ecosystem of next-gen CLI interpreters, structured data pipelines, object shells &amp; cloud workspaces
    </text>
  </g>

  <!-- Feature Tags / Pills (Foreground) -->
  <g transform="translate(102, 275)">
    <!-- Pill 1: POSIX -->
    <rect x="0" y="0" width="130" height="28" rx="14" fill="#0369a1" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1"/>
    <text x="65" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#7dd3fc" text-anchor="middle">⚡ POSIX &amp; Bash</text>

    <!-- Pill 2: Structured Data -->
    <rect x="145" y="0" width="150" height="28" rx="14" fill="#4338ca" fill-opacity="0.35" stroke="#818cf8" stroke-width="1"/>
    <text x="220" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#c7d2fe" text-anchor="middle">📊 Structured Data</text>

    <!-- Pill 3: Object-Oriented -->
    <rect x="310" y="0" width="140" height="28" rx="14" fill="#6d28d9" fill-opacity="0.35" stroke="#c084fc" stroke-width="1"/>
    <text x="380" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#e9d5ff" text-anchor="middle">🧩 Object Pipelines</text>

    <!-- Pill 4: Cloud Shells -->
    <rect x="465" y="0" width="140" height="28" rx="14" fill="#0f766e" fill-opacity="0.35" stroke="#2dd4bf" stroke-width="1"/>
    <text x="535" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#99f6e4" text-anchor="middle">☁️ Cloud Terminals</text>
  </g>
</svg>
